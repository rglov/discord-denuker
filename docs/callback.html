<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denuker — Authorizing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2C2F33;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #23272A;
      border-radius: 12px;
      padding: 40px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .shield { font-size: 52px; margin-bottom: 12px; }
    h1 { font-size: 22px; color: #7289DA; margin-bottom: 6px; }
    .subtitle { color: #B9BBBE; font-size: 14px; margin-bottom: 28px; }
    .status {
      background: #36393F;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.6;
    }
    .status.success { border-left: 4px solid #43B581; }
    .status.error   { border-left: 4px solid #F04747; }
    .status.warning { border-left: 4px solid #FAA61A; }
    .status.loading { border-left: 4px solid #7289DA; }
    .icon { font-size: 28px; margin-bottom: 8px; }
    .note {
      color: #72767D;
      font-size: 12px;
      margin-top: 16px;
      line-height: 1.5;
    }
    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid #7289DA;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡</div>
    <h1>DENUKER</h1>
    <p class="subtitle">Discord Server Backup &amp; Recovery</p>

    <div class="status loading" id="status">
      <div class="spinner"></div>
      <div id="msg">Connecting to Denuker app…</div>
    </div>

    <p class="note" id="note">
      Your authorization code is being sent to the Denuker app running on your server owner's computer.
    </p>
  </div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const code    = params.get("code");
    const errParam = params.get("error");
    const statusEl = document.getElementById("status");
    const msgEl    = document.getElementById("msg");
    const noteEl   = document.getElementById("note");

    function show(type, icon, html, note) {
      statusEl.className = "status " + type;
      msgEl.innerHTML = '<div class="icon">' + icon + '</div>' + html;
      if (note) noteEl.textContent = note;
    }

    if (errParam === "access_denied") {
      show("warning", "⚠️",
        "Authorization cancelled.",
        "You can close this tab. Ask your server owner for the link if you want to try again.");
    } else if (!code) {
      show("error", "❌",
        "No authorization code found in the URL.",
        "This page should only be opened via the Discord authorization link. Please ask your server owner for the correct link.");
    } else {
      // POST the code to the local Denuker server
      fetch("http://127.0.0.1:5173/exchange", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code }),
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          show("success", "✅",
            "<strong>You're registered!</strong><br>" +
            (data.username ? "Welcome, <strong>" + escHtml(data.username) + "</strong>!" : "") +
            "<br><br>If this server ever gets nuked, you'll be automatically re-added.",
            "You can now close this tab.");
        } else {
          show("error", "❌",
            "Registration failed: " + escHtml(data.error || "Unknown error"),
            "Try closing this tab and clicking the link again. If the problem continues, let your server owner know.");
        }
      })
      .catch(() => {
        show("warning", "⚠️",
          "<strong>Could not connect to the Denuker app.</strong><br><br>" +
          "The Denuker app doesn't appear to be running on your server owner's computer right now.",
          'Ask your server owner to open Denuker, start the "Member Registration Server", and share the link again.');
      });
    }

    function escHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
